version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tcms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcms_user
      POSTGRES_PASSWORD: tcms_pass
      POSTGRES_DB: tcms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcms_user -d tcms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tcms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: tcms_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://tcms_user:tcms_pass@postgres:5432/tcms_db
      REDIS_URL: redis://redis:6379/0
      WORKER_URL: http://worker:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  worker:
    build:
      context: ./worker
    container_name: tcms_worker
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "9000:9000"
    volumes:
      - ./worker:/app

volumes:
  pgdata:
